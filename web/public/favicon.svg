<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ausflieger">
  <!-- Ausflieger mark: a paper plane taking off; its trail is a timeline of plan cards. -->
  <rect width="64" height="64" rx="15" fill="#0f6b5c"/>
  <!-- trail / timeline -->
  <path d="M33 31 C 27 36, 21 39, 15 47" fill="none" stroke="#9fe3d2" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 5.2"/>
  <!-- cards on the timeline -->
  <rect x="24.5" y="33" width="9" height="7" rx="2" fill="#f6f3ee"/>
  <rect x="9" y="44" width="11" height="9" rx="2.4" fill="#ff9f5a"/>
  <!-- paper plane -->
  <path d="M55 9 L21 22 L33 27 Z" fill="#f6f3ee"/>
  <path d="M55 9 L33 27 L39 41 Z" fill="#cdeee5"/>
  <path d="M33 27 L35 34 L39 41 Z" fill="#0a4f44" opacity=".55"/>
</svg>
